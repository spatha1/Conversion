<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DCT_ProductBase_INT_1_0_0_0_MainInterview_PolicyDetails_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x grid-padding-x grid-padding-y all-12">
    <div class="cell auto">
      <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static">
        <ng-template dc-section-header-template="" class="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto">
            <div class="field">
              <div class="control-container default-all-shrink">
                <div class="control">
                  <i class="icon-documents" aria-hidden="true"></i>
                </div>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <div class="field">
              <div class="control-container">
                <div class="control is-text">
                  <h2 class="title" data-dc-name="Captions.PolicyDetails" data-innertext="viewmodel.fields?.policy?.captions$policyDetails?.value"></h2>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <div class="field-container default-all-12">
            <dc-combobox class="field medium-4" data-on-change="vm.fieldChanged(viewmodel.fields?.policy?.policyInput$term)" data-field="viewmodel.fields?.policy?.policyInput$term" data-dc-name="PolicyInput.Term"></dc-combobox>
          </div>
          <div class="field-container default-all-12 default-medium-4">
            <dc-datepicker data-field="viewmodel.fields?.policy?.policyInput$effectiveDate" class="field" data-dc-name="PolicyInput.EffectiveDate"></dc-datepicker>
            <!-- INSERTIONPOINT -->
            <dc-timepicker data-field="viewmodel.fields?.policy?.policyInput$effectiveTime" data-dc-name="PolicyInput.EffectiveTime" class="field"></dc-timepicker>
          </div>
          <div class="field-container default-all-12 default-medium-4">
            <dc-datepicker data-field="viewmodel.fields?.policy?.policyInput$expirationDate" class="field" data-dc-name="PolicyInput.ExpirationDate"></dc-datepicker>
            <dc-timepicker data-field="viewmodel.fields?.policy?.policyInput$expirationTime" data-dc-name="PolicyInput.ExpirationTime" class="field"></dc-timepicker>
          </div>
          <div class="field-container default-all-12">
            <dc-combobox class="field medium-8" data-on-change="vm.fieldChanged(viewmodel.fields?.policy?.policyInput$timeZone)" data-field="viewmodel.fields?.policy?.policyInput$timeZone" data-dc-name="PolicyInput.TimeZone"></dc-combobox>
          </div>
        </div>
      </dc-section>
    </div>
  </div>
</div>

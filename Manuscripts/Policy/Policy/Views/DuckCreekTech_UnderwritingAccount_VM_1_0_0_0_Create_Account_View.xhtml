<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_UnderwritingAccount_VM_1_0_0_0_Create_Account_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x">
    <div class="cell all-auto has-padding-none" dc-cell="">
      <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static">
        <ng-template dc-section-header-template="" class="">
          <div pc-dnr="" class="field-container default-all-shrink all-auto">
            <div class="field">
              <div class="control-container">
                <div class="control is-text">
                  <h2 class="title" data-dc-name="Captions.CreateAccount" data-innertext="viewmodel.fields?.account?.captions$createAccount?.value"></h2>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <dc-messages class="is-alert" data-messages="viewmodel.messages?.message" data-if="viewmodel.messages?.message?.length != 0" data-message-filter="comment" data-message-type="alert" data-multishow="false"></dc-messages>
          <div class="field-container default-all-12" data-if="viewmodel.fields?.account?.eliminate?.conditionals$showCreateFields?.value == '1'">
            <dc-text-field data-field="viewmodel.fields?.account?.eliminate?.accountInput$name" class="field all-5" data-dc-name="AccountInput.Name"></dc-text-field>
            <!-- INSERTIONPOINT -->
            <dc-combobox class="field all-4" data-on-change="vm.fieldChanged()" data-field="viewmodel.fields?.account?.eliminate?.accountInput$entityID" data-dc-name="AccountInput.EntityID"></dc-combobox>
            <dc-text-field data-field="viewmodel.fields?.account?.eliminate?.accountInput$number" class="field all-3" data-dc-name="AccountInput.Number"></dc-text-field>
            <dc-combobox class="field all-4" data-on-change="vm.fieldChanged(viewmodel.fields?.account?.eliminate?.accountInput$owner)" data-field="viewmodel.fields?.account?.eliminate?.accountInput$owner" data-dc-name="AccountInput.Owner"></dc-combobox>
            <dc-combobox data-field="viewmodel.fields?.account?.eliminate?.accountInput$type" data-dc-name="AccountInput.Type" data-on-change="vm.fieldChanged(viewmodel.fields?.account?.eliminate?.accountInput$type)" class="field all-4"></dc-combobox>
            <dc-combobox data-field="viewmodel.fields?.account?.eliminate?.accountInput$status" data-dc-name="AccountInput.Status" data-on-change="vm.fieldChanged(viewmodel.fields?.account?.eliminate?.accountInput$status)" class="field all-4"></dc-combobox>
            <dc-combobox class="field all-2" data-on-change="vm.fieldChanged(viewmodel.fields?.account?.eliminate?.accountInput$state)" data-field="viewmodel.fields?.account?.eliminate?.accountInput$stateCode" data-dc-name="AccountInput.StateCode"></dc-combobox>
          </div>
          <div class="field-container default-all-12" data-if="viewmodel.fields?.account?.eliminate2?.conditionals$notShowCreateFields?.value == '1'">
            <dc-string-literal-field class="field has-text-family-content-bold" data-dc-name="UI_SectionCaptionCreateAccount" data-field="viewmodel.fields?.account?.uI_SectionCaptionCreateAccount"></dc-string-literal-field>
          </div>
        </div>
      </dc-section>
    </div>
  </div>
</div>

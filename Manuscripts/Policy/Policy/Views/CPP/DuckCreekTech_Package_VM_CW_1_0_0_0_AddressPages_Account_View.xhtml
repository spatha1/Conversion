<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_ADCPackage_Data_CW_1_0_0_0_AddressPages_Account_View -->
<div class="dc-page" dc-page="">

                <dc-string-literal-field class="field has-text-bold" data-dc-name="PrimaryInsuredDetails" data-field="viewmodel.fields?.account?.primaryInsuredDetails"></dc-string-literal-field>
              </div>
            </ng-template>
            <div class="body dc-section__body">
              <div class="field-container default-all-12" data-if="viewmodel.fields?.account?.accountPrivate$showWhenPartyTypeIndividual?.value == '1'">

                <dc-combobox class="field all-1" data-on-change="vm.fieldChanged(viewmodel.fields?.account?.accountInput$title)" data-field="viewmodel.fields?.account?.accountInput$title" data-dc-name="AccountInput.Title"></dc-combobox>
                <dc-text-field data-field="viewmodel.fields?.account?.accountInput$firstName" class="field all-3" data-dc-name="AccountInput.FirstName"></dc-text-field>

              </div>
              <div class="field-container default-all-12" data-if="viewmodel.fields?.account?.accountPrivate$showWhenPartyTypeOrganisation?.value == '1'">

                    <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.account?.additionalInterest?.addadditionalCoapp" data-dc-name="addadditionalCoapp" mode="hyperlink">
                      <ng-template>
                        <i class="is-left icon-add-template" aria-hidden="true"></i>
                      </ng-template>
                    </dc-action>
                  </div>
                  <!-- INSERTIONPOINT -->
                </div>
              </div>

                  <ng-template dc-hypergridcell-template="" let-iterativeitem="">

                      <dc-combobox class="field" data-on-change="vm.fieldChanged(iterativeItem?.additionalInterestInput$title)" data-field="iterativeItem?.additionalInterestInput$title" data-dc-name="AdditionalInterestInput.Title"></dc-combobox>

                      <dc-text-field data-field="iterativeItem?.additionalInterestInput$middleName" class="field" data-dc-name="AdditionalInterestInput.MiddleName"></dc-text-field>

                    <div class="field-container default-all-12">
                      <dc-text-field data-field="iterativeItem?.additionalInterestInput$lastName" class="field" data-dc-name="AdditionalInterestInput.LastName"></dc-text-field>
                    </div>

                      <div class="field">
                        <div class="control-container default-all-shrink">
                          <dc-action class="control all-shrink has-padding-medium" data-action="iterativeItem?.deleteRecord" data-dc-name="deleteRecord" mode="hyperlink">
                            <ng-template>
                              <i class="is-left icon-trashcan" aria-hidden="true"></i>
                            </ng-template>
                          </dc-action>
                        </div>
                        <!-- INSERTIONPOINT -->
                      </div>
                    </div>
                  </ng-template>
                </dc-hypergrid-celldef>

                <dc-string-literal-field class="field has-text-bold" data-dc-name="ContactDetails" data-field="viewmodel.fields?.account?.contactDetails"></dc-string-literal-field>

            </ng-template>
            <div class="body dc-section__body">

              </div>
              <div class="field-container default-all-12">
                <dc-text-field data-field="viewmodel.fields?.account?.account?.userInputAddress$city" class="field all-4" data-dc-name="UserInputAddress.City"></dc-text-field>

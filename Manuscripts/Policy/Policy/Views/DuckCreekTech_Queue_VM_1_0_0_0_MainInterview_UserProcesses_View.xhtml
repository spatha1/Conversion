                <div class="control is-text">

                  <div class="control-container">

                  </div>
                </div>
              </div>

              <dc-hypergrid expandable="false" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?._QueueData?.semaphoreList?.semaphore?.rows" data-readonly="true" data-grid-data="viewmodel.fields?._QueueData?.semaphoreList?.semaphore?.rows" class="" show-empty-grid-message="true" data-dc-name="Captions.NoProcesses" data-empty-grid-message="viewmodel.fields?._QueueData?.captions$noProcesses?.value">

                    </div>

                </dc-hypergrid-celldef>
                <dc-hypergrid-celldef field="clearItem" data-dc-name="clearItem" class="is-aligned-right">

                            </ng-template>
                          </dc-action>
                          <dc-action class="control all-shrink has-padding-medium" data-action="iterativeItem?.clientLink" data-dc-name="clientLink" mode="hyperlink">

                      </div>
                    </div>
                  </ng-template>

          <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static" data-if="viewmodel.fields?._QueueData?.userPreferences$isUserPreferences?.value == '1'">

              <div pc-dnr="" class="field-container section-header-field-container default-all-shrink all-auto">
                <div class="field">
                  <div class="control-container">
                    <div class="control is-text">
                      <h2 class="title" data-dc-name="Captions.UserPreferences" data-innertext="viewmodel.fields?._QueueData?.captions$userPreferences?.value"></h2>
                    </div>
                  </div>
                </div>
              </div>
            </ng-template>
            <div class="body dc-section__body">
              <div class="field-container default-all-12 has-padding-smallest">
                <dc-checkbox data-field="viewmodel.fields?._QueueData?.asyncNotification?.asyncNotification$emails" data-dc-name="AsyncNotification.emails" class="field has-padding-smallest" data-labelbefore="false" data-labelafter="true"></dc-checkbox>
                <dc-checkbox data-field="viewmodel.fields?._QueueData?.asyncNotification?.asyncNotification$notifications" data-dc-name="AsyncNotification.notifications" class="field has-padding-smallest" data-labelafter="true"></dc-checkbox>
                <dc-checkbox data-field="viewmodel.fields?._QueueData?.asyncNotification?.asyncNotification$tasks" data-dc-name="AsyncNotification.tasks" class="field has-padding-smallest" data-labelafter="true"></dc-checkbox>

              </div>

                  <div class="control-container">

                    <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?._QueueData?.cancelSaveUserPreferences" data-dc-name="cancelSaveUserPreferences" mode="button"></dc-action>
                  </div>
                  <!-- INSERTIONPOINT -->
                </div>
              </div>
            </div>
          </dc-section>

<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=SME_AU_VM_1_0_0_0_MainInterview_Property_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x grid-padding-x grid-padding-y all-12">
    <div class="cell all-auto" dc-cell="">
      <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static">
        <ng-template dc-section-header-template="" class="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto">
            <dc-string-literal-field class="field" data-dc-name="HomeInformation" data-field="viewmodel.fields?.address?.homeInformation"></dc-string-literal-field>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <div class="field-container default-all-12">
            <dc-combobox class="field all-6" data-on-change="vm.fieldChanged(viewmodel.fields?.address?.locationOutput$allLocations)" data-field="viewmodel.fields?.address?.locationOutput$allLocations" data-dc-name="LocationOutput.AllLocations"></dc-combobox>
            <div class="field all-6">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.property?.addbuilding" data-dc-name="addbuilding" mode="button" data-openpopup="true"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <!-- INSERTIONPOINT -->
          </div>
          <template>
            <!-- GROUP -->
          </template>
          <dc-hypergrid expandable="true" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?.property?.rows" data-readonly="true" data-grid-data="viewmodel.fields?.property?.rows" class="">
            <dc-hypergrid-celldef field="propertyInput$buildingLocationDescription" data-dc-name="PropertyPrivate.BuildingLocationDescription" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                <div class="field-container default-all-12">
                  <dc-text-field data-field="iterativeItem?.propertyInput$buildingLocationDescription" class="field" data-dc-name="PropertyInput.BuildingLocationDescription"></dc-text-field>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="propertyInput$buildingName" data-dc-name="PropertyInput.BuildingName" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                <div class="field-container default-all-12">
                  <dc-text-field data-field="iterativeItem?.propertyInput$buildingName" class="field" data-dc-name="PropertyInput.BuildingName"></dc-text-field>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="detail" data-dc-name="detail" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
                <div class="field-container default-all-12">
                  <div class="field">
                    <div class="control-container default-all-shrink">
                      <dc-action class="control all-shrink has-padding-medium is-action" data-action="iterativeItem?.detail" data-dc-name="detail" mode="button" data-openpopup="true"></dc-action>
                    </div>
                    <!-- INSERTIONPOINT -->
                  </div>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="delete" data-dc-name="delete" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
                <div class="field-container default-all-12">
                  <div class="field">
                    <div class="control-container default-all-shrink">
                      <dc-action class="control all-shrink has-padding-medium" data-action="iterativeItem?.delete" data-dc-name="delete" mode="hyperlink">
                        <ng-template>
                          <i class="is-left icon-trashcan" aria-hidden="true"></i>
                        </ng-template>
                      </dc-action>
                      <dc-action class="control all-shrink has-padding-medium" data-action="iterativeItem?.deleteNB" data-dc-name="deleteNB" mode="hyperlink">
                        <ng-template>
                          <i class="is-left icon-trashcan" aria-hidden="true"></i>
                        </ng-template>
                      </dc-action>
                    </div>
                    <!-- INSERTIONPOINT -->
                  </div>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
          </dc-hypergrid>
        </div>
      </dc-section>
    </div>
  </div>
</div>

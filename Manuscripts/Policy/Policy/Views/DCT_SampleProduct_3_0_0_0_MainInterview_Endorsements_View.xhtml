<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DCT_SampleProduct_3_0_0_0_MainInterview_Endorsements_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x grid-padding-x grid-padding-y small-12">
    <div class="cell all-12" dc-cell="">
      <dc-section data-expandable="false" data-expand-eventfield="" class="is-static">
        <ng-template dc-section-header-template="" class="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-12 all-auto">
            <dc-string-literal-field class="field title has-text-size-large" data-dc-name="EndorsementsPage.EndorsementsCaption" data-field="viewmodel.fields?.userInterface?.endorsementsPage$endorsementsCaption"></dc-string-literal-field>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <dc-hypergrid expandable="true" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?.manuScriptCoverage?.rows" data-readonly="false" data-grid-data="viewmodel.fields?.manuScriptCoverage?.rows" class="has-banding-even" show-empty-grid-message="true" data-dc-name="EndorsementsPage.EmptyGridMessage" data-empty-grid-message="viewmodel.fields?.userInterface?.endorsementsPage$emptyGridMessage?.value">
            <dc-hypergrid-celldef field="manuScriptCoverageInput$description" data-dc-name="ManuScriptCoverageInput.Description" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                <div class="field-container default-all-12">
                  <dc-text-field data-field="iterativeItem?.manuScriptCoverageInput$description" class="field all-3" data-dc-name="ManuScriptCoverageInput.Description"></dc-text-field>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="manuScriptCoverageInput$baseRate" data-dc-name="ManuScriptCoverageInput.BaseRate" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                <div class="field-container default-all-12">
                  <dc-text-field data-field="iterativeItem?.manuScriptCoverageInput$baseRate" class="field all-3" data-dc-name="ManuScriptCoverageInput.BaseRate"></dc-text-field>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="manuScriptCoverageInput$fullyEarnedIndicator" data-dc-name="ManuScriptCoverageInput.FullyEarnedIndicator" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                <div class="field-container default-all-12">
                  <dc-checkbox data-field="iterativeItem?.manuScriptCoverageInput$fullyEarnedIndicator" data-dc-name="ManuScriptCoverageInput.FullyEarnedIndicator" class="field all-12"></dc-checkbox>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="deleteAction" data-dc-name="deleteAction" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
                <div class="field-container default-all-12">
                  <div class="field all-12">
                    <div class="control-container default-all-shrink is-aligned-right">
                      <dc-action class="control all-shrink is-clear has-text-hidden" data-action="iterativeItem?.deleteAction" data-dc-name="deleteAction" mode="button">
                        <ng-template>
                          <i class="icon-trashcan"></i>
                        </ng-template>
                      </dc-action>
                      <dc-action class="control all-shrink has-text-hidden is-clear" data-action="iterativeItem?.markForDeleteAction" data-dc-name="markForDeleteAction" mode="button">
                        <ng-template>
                          <i class="icon-trashcan"></i>
                        </ng-template>
                      </dc-action>
                    </div>
                    <!-- INSERTIONPOINT -->
                  </div>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
          </dc-hypergrid>
          <div class="field-container default-all-12">
            <div class="field all-12">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink" data-action="viewmodel.fields?.manuScriptCoverage?.addAction" data-dc-name="addAction" mode="button"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <dc-string-literal-field class="field all-12" data-dc-name="UserInterface.Disclaimer" data-field="viewmodel.fields?.userInterface?.userInterface$disclaimer"></dc-string-literal-field>
          </div>
        </div>
      </dc-section>
    </div>
  </div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PP Conversion Flow</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #12141c; color: #dde; font-size: 13px; }

/* ── TOP BAR ── */
.topbar { background: #1a1d2b; border-bottom: 2px solid #2e3350;
  padding: 10px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.topbar h1 { font-size: 15px; color: #9ab4e0; letter-spacing: .5px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 5px 13px; border-radius: 20px; cursor: pointer; font-size: 12px;
  border: 1px solid #333; background: #1e2235; color: #888; transition: all .15s; }
.tab:hover { border-color: #555; color: #bbb; }
.tab.active { color: #fff; font-weight: 600; border-color: transparent; }

/* ── MAIN CANVAS ── */
.canvas { padding: 20px 22px; }

/* ── DOMAIN TITLE ── */
.domain-title { font-size: 14px; font-weight: 700; margin-bottom: 16px;
  padding-bottom: 6px; border-bottom: 1px solid #252840; }

/* ── FLOW ROW ── */
.flow-row { display: flex; align-items: flex-start; gap: 0; margin-bottom: 18px; flex-wrap: wrap; }
.flow-row + .flow-row { margin-top: 4px; }

/* seq label */
.seq-badge { width: 34px; flex-shrink: 0; display: flex; align-items: center;
  justify-content: center; padding-top: 14px; }
.seq-badge span { font-size: 10px; font-weight: 700; padding: 3px 5px;
  border-radius: 4px; background: #222535; color: #666; }

/* ── NODE ── */
.node { border-radius: 8px; border: 1.5px solid; padding: 9px 13px;
  cursor: pointer; min-width: 130px; max-width: 200px; transition: all .15s;
  position: relative; user-select: none; }
.node:hover { filter: brightness(1.15); }
.node.active { box-shadow: 0 0 0 2px #fff3; }
.node .nt { font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
  opacity: .6; margin-bottom: 3px; }
.node .nn { font-size: 12px; font-weight: 700; line-height: 1.3; word-break: break-all; }
.node .nr { font-size: 10px; opacity: .55; margin-top: 3px; }
.node .nbadge { display: inline-block; font-size: 9px; padding: 1px 5px;
  border-radius: 3px; margin-top: 4px; font-weight: 700; }
.nbadge.fixed { background: #b71c1c; color: #fff; }
.nbadge.ok    { background: #1b5e20; color: #a5d6a7; }
.nbadge.open  { background: #e65100; color: #fff; }

/* stacked source tables */
.src-stack { display: flex; flex-direction: column; gap: 6px; }

/* Pure section */
.pure-section { display: flex; flex-direction: column; }
.pure-layer-label { font-size: 9px; color: #f9a825; text-transform: uppercase;
  letter-spacing: .6px; margin-bottom: 5px; font-weight: 700; }

/* ── ARROW ── */
.arrow { display: flex; align-items: center; padding: 0 8px; padding-top: 12px;
  flex-shrink: 0; color: #3a3e5a; font-size: 20px; }
.arrow.big { font-size: 24px; }
/* SP stored-procedure arrow */
.arrow-sp { display: flex; flex-direction: column; align-items: center; padding: 0 6px;
  padding-top: 12px; flex-shrink: 0; color: #f9a825; }
.arrow-sp .arrow-glyph { font-size: 22px; }
.arrow-sp .arrow-lbl { font-size: 9px; color: #f9a825; margin-top: 1px; letter-spacing: .3px; }

/* ── DETAIL PANEL ── */
.detail-panel { background: #1a1d2e; border: 1px solid #2c3055;
  border-radius: 8px; padding: 14px 18px; margin-top: 10px;
  margin-left: 34px;
  animation: fadein .15s ease; }
@keyframes fadein { from { opacity:0; transform:translateY(-6px);} to { opacity:1; transform:none;} }
.detail-panel h4 { font-size: 12px; font-weight: 700; margin-bottom: 8px; color: #a0b4e0; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.detail-section { display: block; }
.detail-section h5 { font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
  color: #556; margin-bottom: 5px; }
.detail-section p, .detail-section li { font-size: 11px; color: #9ab; line-height: 1.7; }
.detail-section ul { padding-left: 14px; }
.detail-section code { background: #0d0f1a; padding: 1px 5px; border-radius: 3px;
  color: #ce93d8; font-size: 10px; }
.cond-pill { display: inline-block; background: #1e2538; border: 1px solid #3a4060;
  border-radius: 4px; padding: 2px 7px; margin: 2px 2px 0 0; font-size: 10px; color: #8ab; }
.col-chip { display: inline-block; background: #151827; border: 1px solid #2a2f45;
  border-radius: 3px; padding: 1px 5px; margin: 1px; font-size: 10px; color: #778; }
.col-chip.key { border-color: #4a5580; color: #9ab; }
.col-chip.pu  { border-color: #f9a825; color: #f9a825; background: #1a130a; }
.fix-note { background: #1a0d0d; border: 1px solid #c62828; border-radius: 4px;
  padding: 5px 9px; font-size: 11px; color: #ef9a9a; margin-top: 4px; }
.ok-note  { background: #0d1a0d; border: 1px solid #2e7d32; border-radius: 4px;
  padding: 5px 9px; font-size: 11px; color: #a5d6a7; margin-top: 4px; }
.map-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: 10px; }
.map-row .pure-col { color: #f9a825; font-family: monospace; }
.map-row .arr { color: #444; }
.map-row .dev-col  { color: #9ab; font-family: monospace; }

/* domain colours */
.cl { border-color: #1565c0; background: #0a1525; }
.pr { border-color: #4527a0; background: #0d0a1f; }
.lo { border-color: #2e7d32; background: #0a150a; }
.hb { border-color: #b71c1c; background: #1a0a0a; }
.hc { border-color: #00695c; background: #0a1a18; }
.rb { border-color: #e65100; background: #1a100a; }
.cm { border-color: #6a1b9a; background: #150a1a; }
.sc { border-color: #795548; background: #131010; }
.pu { border-color: #f9a825; background: #1a130a; } /* Pure / PRD05External */

.tab-cl  { background: #1565c0; }
.tab-pr  { background: #4527a0; }
.tab-lo  { background: #2e7d32; }
.tab-hb  { background: #b71c1c; }
.tab-hc  { background: #00695c; }
.tab-rb  { background: #e65100; }
.tab-cm  { background: #6a1b9a; }
.tab-sc  { background: #4e342e; }

.dt-cl { color: #64b5f6; border-bottom-color: #1565c0; }
.dt-pr { color: #9575cd; border-bottom-color: #4527a0; }
.dt-lo { color: #81c784; border-bottom-color: #2e7d32; }
.dt-hb { color: #ef9a9a; border-bottom-color: #b71c1c; }
.dt-hc { color: #80cbc4; border-bottom-color: #00695c; }
.dt-rb { color: #ffb74d; border-bottom-color: #e65100; }
.dt-cm { color: #ce93d8; border-bottom-color: #6a1b9a; }
.dt-sc { color: #bcaaa4; border-bottom-color: #4e342e; }

/* dct terminal */
.dct-node { border-radius: 8px; border: 1.5px solid #37474f;
  background: #0d1215; padding: 9px 13px; min-width: 90px; text-align: center; }
.dct-node .nt { font-size: 10px; color: #546e7a; text-transform: uppercase; letter-spacing: .8px; }
.dct-node .nn { font-size: 13px; font-weight: 700; color: #78909c; margin-top: 3px; }

/* Pure DB banner at top of detail */
.pure-db-banner { background: #1a130a; border: 1px solid #f9a825; border-radius: 4px;
  padding: 4px 8px; font-size: 10px; color: #f9a825; margin-bottom: 8px; }
</style>
</head>
<body>

  <h1>PP Conversion — Flow Diagram</h1>

<div class="canvas" id="canvas"></div>

// ────────────────────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────────────────────
let activeDetail = null;

function showDomain(tabEl, domain) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  activeDetail = null;
  render(domain);
}

// ────────────────────────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────────────────────────
function render(domain) {
  const d = DOMAINS[domain];
  let html = `<div class="domain-title ${d.titleCls}">${d.title}</div>`;

  d.rows.forEach((row, ri) => {
    const rowId = `${domain}-${ri}`;
    html += `<div class="flow-row" id="row-${rowId}">`;

    // Seq badge
    html += `<div class="seq-badge"><span>${row.seqs.join('<br>')}</span></div>`;

    // ── Pure layer (PRD05External) ──
    if (row.pureSources && row.pureSources.length) {
      html += `<div class="pure-section">`;
      html += `<div class="pure-layer-label">Pure · PRD05External</div>`;
      html += `<div class="src-stack">`;
      row.pureSources.forEach((src, pi) => {
        const nid = `${rowId}-pure-${pi}`;
        html += nodeHtml(src, nid, rowId);
      });
      html += `</div></div>`;
      // SP arrow — indicates stored procedure transformation
      html += `<div class="arrow-sp"><div class="arrow-glyph">⟹</div><span class="arrow-lbl">SP</span></div>`;
    }

    // ── DEV Staging Sources ──
    html += `<div class="src-stack">`;
    row.sources.forEach((src, si) => {
      const nid = `${rowId}-src-${si}`;
      html += nodeHtml(src, nid, rowId);
    });
    html += `</div>`;

    // Arrow to view
    html += `<div class="arrow big">→</div>`;

    // View
    if (row.view) {
      const nid = `${rowId}-view`;
      html += nodeHtml(row.view, nid, rowId, true);
      html += `<div class="arrow big">→</div>`;
    }

    // Target
    if (row.target) {
      const nid = `${rowId}-tgt`;
      html += nodeHtml(row.target, nid, rowId);
      html += `<div class="arrow">→</div>`;
    }

    // DCT terminal
    html += `<div class="dct-node" style="padding-top:14px">
      <div class="nt">Endpoint</div>
      <div class="nn">DCT</div>
    </div>`;

    html += `</div>`; // .flow-row

    // Detail panel placeholder
    html += `<div id="detail-${rowId}" style="display:none"></div>`;
  });

  document.getElementById('canvas').innerHTML = html;
}

function nodeHtml(node, nid, rowId, isView) {
  const hasFixes = node.detail && (node.detail.fixes || node.detail.fix || node.detail.openBugs);
  let badges = '';
  if (node.detail && node.detail.fixes && node.detail.fixes.length) badges += `<span class="nbadge ok">✓ FIXED</span> `;
  if (node.detail && node.detail.fix) badges += `<span class="nbadge fixed">FIX</span> `;
  if (node.detail && node.detail.openBugs) badges += `<span class="nbadge open">⚠ OPEN</span>`;

  return `<div class="node ${node.cls || ''}" id="${nid}" onclick="toggleDetail('${nid}','${rowId}',${JSON.stringify(node).split('"').join('&quot;')})">
    <div class="nt">${node.type || (isView ? 'Snowflake View' : 'Table')}</div>
    <div class="nn">${node.name}</div>
    ${node.rows ? `<div class="nr">${node.rows} rows</div>` : ''}
    ${badges}
  </div>`;
}

function toggleDetail(nid, rowId, nodeData) {
  const panel = document.getElementById(`detail-${rowId}`);
  const clickedNode = document.getElementById(nid);

  if (activeDetail && activeDetail.nid === nid) {
    panel.style.display = 'none';
    clickedNode.classList.remove('active');
    activeDetail = null;
    return;
  }

  if (activeDetail) {
    const old = document.getElementById(activeDetail.nid);
    if (old) old.classList.remove('active');
  }

  clickedNode.classList.add('active');
  activeDetail = { nid, rowId };

  const d = nodeData.detail || {};
  let html = `<div class="detail-panel"><h4>${nodeData.name}</h4>`;

  // Pure DB banner
  if (d.pureDb) {
    html += `<div class="pure-db-banner">📦 PRD_T5_EXTERNAL_AGGNE.PURE_SNAPSHOT &nbsp;·&nbsp; ${d.pureDb.split('.').pop()}</div>`;
  }

  html += `<div class="detail-grid">`;

  if (d.role)   html += section('Role', `<p>${d.role}</p>`);
  if (d.note)   html += section('Note', `<p>${d.note}</p>`);
  if (d.keys)   html += section('Join Keys', d.keys.map(k=>`<span class="col-chip key">${k}</span>`).join(''));
  if (d.filter) html += section('WHERE Filter', `<span class="cond-pill">${d.filter}</span>`);
  if (d.filters && d.filters.length) html += section('Filters', d.filters.map(f=>`<span class="cond-pill">${f}</span>`).join(''));
  if (d.join)   html += section('Join Condition', `<span class="cond-pill">${d.join}</span>`);
  if (d.ctes)   html += section('CTE Structure', d.ctes.split('\n').map(l=>`<p>${l}</p>`).join(''));
  if (d.conditions && d.conditions.length) {
    html += section('Conditions Applied', d.conditions.map(c=>`<span class="cond-pill">${c}</span>`).join(''));
  }
  // Pure→DEV column mapping
  if (d.mapping && d.mapping.length) {
    const rows = d.mapping.map(([p,a,v]) =>
      `<div class="map-row"><span class="pure-col">${p}</span><span class="arr">${a}</span><span class="dev-col">${v}</span></div>`
    ).join('');
    html += section('Pure → DEV Mapping', rows);
  }
  if (d.cols)   html += section('Columns', d.cols.split(' · ').map(c=>`<span class="col-chip">${c}</span>`).join(''));
  if (d.tokens) html += section('SQL Server Tokens', `<code>${d.tokens}</code>`);
  if (d.sqlserver) html += section('SQL Server Template Change', `<code>${d.sqlserver}</code>`);
  if (d.fix)    html += section('Fix Applied', `<div class="fix-note"><code>${d.fix}</code></div>`);
  if (d.fixes && d.fixes.length) {
    html += section('Fixes Applied', d.fixes.map(f=>`<div class="ok-note">${f}</div>`).join(''));
  }
  if (d.openBugs && d.openBugs.length) {
    html += section('Open Bugs', d.openBugs.map(b=>`<div class="fix-note">${b}</div>`).join(''));
  }
  if (d.next)       html += section('Next Step', `<span class="cond-pill">${d.next}</span>`);
  if (d.validation) html += section('Validation', `<p>${d.validation}</p>`);

  html += '</div></div>';
  panel.innerHTML = html;
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function section(title, body) {
  return `<div class="detail-section"><h5>${title}</h5>${body}</div>`;
}

// ── INIT ──
render('scope');
</script>

<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_Notes_VM_1_0_0_0_NoteDetails_NoteDetails_View -->
<div class="panel" pc-type="Panel">
  <div class="field-container default-all-12 default-all-label-width-narrow">

    <dc-string-literal-field class="field" data-dc-name="CommentOutput.CommentCategoryDetails" data-field="viewmodel.fields?.comment?.commentOutput$commentCategoryDetails"></dc-string-literal-field>
    <dc-string-literal-field class="field" data-dc-name="CommentOutput.CommentSubCategoryDetails" data-field="viewmodel.fields?.comment?.commentOutput$commentSubCategoryDetails"></dc-string-literal-field>
    <dc-string-literal-field class="field" data-dc-name="CommentOutput.CommentTextDetails" data-field="viewmodel.fields?.comment?.commentOutput$commentTextDetails"></dc-string-literal-field>
  </div>
  <div class="field-container default-all-12 has-labels-hidden has-padding-none">
    <dc-string-literal-field class="field" data-dc-name="CommentOutput.CommentTypeDetails" data-field="viewmodel.fields?.comment?.commentOutput$commentTypeDetails"></dc-string-literal-field>
    <dc-string-literal-field class="field all-shrink" data-dc-name="CommentOutput.CreationDetails" data-field="viewmodel.fields?.comment?.commentOutput$creationDetails"></dc-string-literal-field>

      <div class="control-container default-all-shrink">
        <div class="control is-text">
          <h3 class="has-text-size-small title" data-dc-name="Captions.AttachmentsCaption" data-innertext="viewmodel.fields?.comment?.captions$attachmentsCaption?.value"></h3>
        </div>
      </div>
      <!-- INSERTIONPOINT -->
    </div>
  </div>
  <div class="field-container default-all-12" data-if="viewmodel.fields?.comment?.commentPrivate$isAttachmentFound?.value == '1'">

  </div>
  <div class="field-container default-all-12 has-border-bottom" data-repeat="let iterativeItem of viewmodel.fields?.comment?.commentAttachments?.commentAttachment?.rows" data-dc-iterative="viewmodel.fields?.comment?.commentAttachments?.commentAttachment?.rows">
    <div class="field has-margin-bottom-none">
      <div class="control-container default-all-shrink">
        <dc-action class="control all-shrink" data-action="iterativeItem?.downloadAttachment" data-dc-name="downloadAttachment" mode="hyperlink"></dc-action>

    </div>
  </div>
  <div class="field-container default-all-12">
    <div class="field">
      <div class="control-container default-all-shrink is-aligned-right">
        <dc-action class="control all-shrink" data-action="viewmodel.fields?.comment?.returnToNotes" data-dc-name="returnToNotes" mode="button"></dc-action>
      </div>
      <!-- INSERTIONPOINT -->
    </div>
  </div>

<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_UnderwritingAccount_UpcomingPolicyRenewals_VM_1_0_0_0_UpcomingPolicyRenewals_UpcomingPolicyRenewalsDashboard_View -->
<dc-section data-expandable="true" data-expanded="true" data-expand-eventfield="" class="has-margin-left-small has-margin-right-small" pc-type="Section">
  <ng-template dc-section-header-template="" class="">
    <div pc-dnr="" class="section-header-field-container field-container all-auto default-all-6">
      <div class="field">
        <div class="control-container">
          <div class="control is-text">
            <h2 class="title" data-dc-name="UpcomingPolicyRenewals" data-innertext="viewmodel.fields?._underwritingData?.upcomingPolicyRenewals?.value"></h2>

        </div>
      </div>
    </div>
  </ng-template>
  <div class="body dc-section__body">
    <div class="field-container default-all-12">
      <dc-combobox class="field all-3" data-on-change="vm.fieldChanged(viewmodel.fields?._underwritingData?.policyFilter?.policyFilterInput$status)" data-field="viewmodel.fields?._underwritingData?.policyFilter?.policyFilterInput$status" data-dc-name="PolicyFilterInput.Status" data-allowinvalid="false" data-dctrack="false"></dc-combobox>

          <dc-action class="control all-shrink" data-action="viewmodel.fields?._underwritingData?.policyFilter?.clearFilters" data-dc-name="clearFilters" mode="hyperlink"></dc-action>
        </div>
        <!-- INSERTIONPOINT -->
      </div>
    </div>

      <dc-hypergrid-celldef field="openUWAccount" data-dc-name="openUWAccount" class="">

          <div class="field-container default-all-12">
            <div class="field">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink" data-action="iterativeItem?.openUWAccount" data-dc-name="openUWAccount" mode="hyperlink"></dc-action>

              <!-- INSERTIONPOINT -->
            </div>
          </div>
        </ng-template>
        <ng-template dc-hypergridheadercell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="UWAccountName" data-field="viewmodel.fields?._underwritingData?.policyRenewals?.uWAccountName"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="policy$policyNumber" data-dc-name="Policy.PolicyNumber" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <div class="field">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink has-padding-medium" data-action="iterativeItem?.openPolicy" data-dc-name="openPolicy" mode="hyperlink"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="policy$status" data-dc-name="Policy.Status" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="Policy.Status" data-field="iterativeItem?.policy$status"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="policy$oldPremium" data-dc-name="Policy.OldPremium" class="">

          <div class="field-container default-all-12">

        </ng-template>

          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="policy$premiumChange" data-dc-name="Policy.PremiumChange" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12" data-if="iterativeItem?.policyPrivate$premChangePlus?.value == '1'">
            <dc-string-literal-field class="field has-text-color-success-light" data-dc-name="PolicyPrivate.ConcatedValuePremChange" data-field="iterativeItem?.policyPrivate$concatedValuePremChange"></dc-string-literal-field>
          </div>
          <div class="field-container default-all-12" data-if="iterativeItem?.policyPrivate$premChangeNeg?.value == '1'">
            <dc-string-literal-field class="field has-text-color-alert-light" data-dc-name="Policy.PremiumChange" data-field="iterativeItem?.policy$premiumChange"></dc-string-literal-field>
          </div>
          <div class="field-container default-all-12" data-if="iterativeItem?.policyPrivate$premChangeZero?.value == '1'">
            <dc-string-literal-field class="field" data-dc-name="Policy.PremiumChange" data-field="iterativeItem?.policy$premiumChange"></dc-string-literal-field>
          </div>
        </ng-template>
        <ng-template dc-hypergridheadercell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="UICaptions.ColHeaderPremiumChange" data-field="iterativeItem?.uICaptions$colHeaderPremiumChange"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="policy$expirationDate" data-dc-name="Policy.ExpirationDate" class="">

        <!-- INSERTIONPOINT -->
      </div>

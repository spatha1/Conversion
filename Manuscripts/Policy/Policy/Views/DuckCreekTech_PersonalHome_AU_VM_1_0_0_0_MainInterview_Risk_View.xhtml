<!-- @TYPE=VIEW @ID=DuckCreekTech_PersonalHome_AU_VM_1_0_0_0_MainInterview_Risk_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x grid-padding-x grid-padding-y all-12">
    <div class="cell all-auto" dc-cell="">
      <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static">
        <ng-template dc-section-header-template="" class="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto">
            <dc-string-literal-field class="field" data-dc-name="HomeInformation" data-field="viewmodel.fields?.address?.homeInformation"></dc-string-literal-field>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <div class="field-container default-all-12">
            <dc-radio-group data-field="viewmodel.fields?.address?.coveragePackage$value" data-mode="radio" data-dc-name="CoveragePackage.Value" class="field is-horizontal-shrink all-12"></dc-radio-group>
            <dc-combobox class="field all-6" data-on-change="vm.fieldChanged(viewmodel.fields?.address?.locationOutput$allLocations)" data-field="viewmodel.fields?.address?.locationOutput$allLocations" data-dc-name="LocationOutput.AllLocations"></dc-combobox>
            <div class="field all-6">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink has-padding-medium is-action" data-action="viewmodel.fields?.risk?.addbuilding" data-dc-name="addbuilding" mode="button" data-openpopup="false" data-popupsize="is-larger"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <!-- INSERTIONPOINT -->
          </div>
          <dc-hypergrid expandable="true" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?.risk?.rows" data-readonly="true" data-grid-data="viewmodel.fields?.risk?.rows" class="">
            <dc-hypergrid-celldef field="locationInput$description" data-dc-name="LocationInput.Description" class="table-cell--width50">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                <div class="field-container default-all-12">
                  <dc-text-field data-field="iterativeItem?.riskPrivate$buildingLocationDescription" class="field" data-dc-name="RiskPrivate.BuildingLocationDescription"></dc-text-field>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="editRecord" data-dc-name="editRecord" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                <div class="field-container default-all-12">
                  <div class="field">
                    <div class="control-container default-all-shrink">
                      <dc-action class="control all-shrink has-padding-medium is-action" data-action="iterativeItem?.editRecord" data-dc-name="editRecord" mode="button" data-openpopup="true" data-popupsize="is-larger">
                        <ng-template></ng-template>
                      </dc-action>
                    </div>
                    <!-- INSERTIONPOINT -->
                  </div>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="deleteHome" data-dc-name="deleteHome">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                <div class="field-container default-all-12">
                  <div class="field">
                    <div class="control-container default-all-shrink">
                      <dc-action class="control all-shrink has-padding-medium has-text-hidden" data-action="iterativeItem?.deleteHome" data-dc-name="deleteHome" mode="hyperlink">
                        <ng-template>
                          <i class="is-left icon-trashcan" aria-hidden="true"></i>
                        </ng-template>
                      </dc-action>
                    </div>
                    <!-- INSERTIONPOINT -->
                  </div>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
          </dc-hypergrid>
        </div>
      </dc-section>
      <dc-messages class="" data-messages="viewmodel.messages?.message" data-type="info" data-if="viewmodel.messages?.message?.length != 0" data-message-filter="all"></dc-messages>
    </div>
  </div>
</div>

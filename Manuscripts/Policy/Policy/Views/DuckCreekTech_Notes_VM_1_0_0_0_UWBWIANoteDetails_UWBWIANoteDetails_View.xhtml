<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_Notes_VM_1_0_0_0_UWBWIANoteDetails_UWBWIANoteDetails_View -->
<div class="panel" pc-type="Panel" draggable="false">
  <div class="field-container default-all-12">
    <div class="field">
      <div class="control-container default-all-shrink">
        <div class="control is-text">
          <h2 class="title has-text-transform-uppercase" data-dc-name="Note" data-innertext="viewmodel.fields?._NotesData?.note?.value"></h2>
        </div>
      </div>
      <!-- INSERTIONPOINT -->
    </div>
    <dc-string-literal-field class="field" data-dc-name="CommentOutput.CommentSubjectDetails" data-field="viewmodel.fields?.comment?.commentOutput$commentSubjectDetails"></dc-string-literal-field>
    <dc-string-literal-field class="field" data-dc-name="CommentOutput.CommentCategoryDetails" data-field="viewmodel.fields?.comment?.commentOutput$commentCategoryDetails"></dc-string-literal-field>
    <dc-string-literal-field class="field" data-dc-name="CommentOutput.CommentSubCategoryDetails" data-field="viewmodel.fields?.comment?.commentOutput$commentSubCategoryDetails"></dc-string-literal-field>
    <dc-string-literal-field class="field" data-dc-name="CommentOutput.CommentTextDetails" data-field="viewmodel.fields?.comment?.commentOutput$commentTextDetails"></dc-string-literal-field>
  </div>
  <div class="field-container has-labels-hidden has-padding-none">
    <dc-text-field data-field="viewmodel.fields?.comment?.commentOutput$commentTypeDetails" class="field has-margin-bottom-none" data-dc-name="CommentOutput.CommentTypeDetails"></dc-text-field>
    <dc-string-literal-field class="field all-shrink has-margin-bottom-none" data-dc-name="CommentOutput.CreationDetails" data-field="viewmodel.fields?.comment?.commentOutput$creationDetails"></dc-string-literal-field>
    <dc-string-literal-field class="all-shrink field" data-dc-name="CommentInput.CreationDateTime" data-field="viewmodel.fields?.comment?.commentInput$creationDateTime"></dc-string-literal-field>
    <div class="field has-margin-bottom-none">
      <div class="control-container default-all-shrink">
        <div class="control is-text">
          <h3 class="title has-text-transform-uppercase" data-dc-name="Captions.AttachmentsCaption" data-innertext="viewmodel.fields?.comment?.commentAttachments?.captions$attachmentsCaption?.value"></h3>
        </div>
      </div>
      <!-- INSERTIONPOINT -->
    </div>
  </div>
  <div class="field-container default-all-12" data-if="viewmodel.fields?.comment?.commentPrivate$isAttachmentFound?.value == '1'">
    <dc-text-field data-field="viewmodel.fields?.comment?.commentPrivate$attachmentNotFoundMessage" class="field" data-dc-name="CommentPrivate.AttachmentNotFoundMessage"></dc-text-field>
  </div>
  <div class="field-container default-all-12 has-border-bottom has-labels-hidden" data-repeat="let iterativeItem of viewmodel.fields?.comment?.commentAttachments?.commentAttachment?.rows" data-dc-iterative="viewmodel.fields?.comment?.commentAttachments?.commentAttachment?.rows">
    <div class="field">
      <div class="control-container default-all-shrink">
        <dc-action class="control all-shrink" data-action="iterativeItem?.downloadAttachment" data-dc-name="downloadAttachment" mode="hyperlink"></dc-action>
      </div>
      <!-- INSERTIONPOINT -->
    </div>
  </div>
  <div class="field-container default-all-12">
    <div class="field has-padding-none all-12">
      <div class="control-container default-all-shrink is-aligned-right">
        <dc-action class="control all-shrink" data-action="viewmodel.fields?.comment?.uWBReturnToNotes" data-dc-name="uWBReturnToNotes" mode="button"></dc-action>
      </div>
      <!-- INSERTIONPOINT -->
    </div>
  </div>
</div>

<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_PersonalHome_AU_VM_1_0_0_0_PriorInsurance_PolicyHolderInfo_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x all-12">
    <div class="cell auto">
      <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static">
        <ng-template dc-section-header-template="" class="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto">
            <div class="field">
              <div class="control-container">
                <div class="control is-text">
                  <h1 class="title has-text-size-larger" data-dc-name="PolicyHolderDeclaration" data-innertext="viewmodel.fields?.policyHolderDeclaration?.policyHolderDeclaration?.value"></h1>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <div class="field-container default-all-12">
            <dc-radio-group data-field="viewmodel.fields?.policyHolderDeclaration?.policyHolderDeclarationInput$refusedInsurance" data-mode="radio" data-dc-name="PolicyHolderDeclarationInput.RefusedInsurance" class="field has-field-label-text-align-left is-horizontal-shrink has-field-value-text-align-right"></dc-radio-group>
            <dc-radio-group data-field="viewmodel.fields?.policyHolderDeclaration?.policyHolderDeclarationInput$criminalConviction" data-mode="radio" data-dc-name="PolicyHolderDeclarationInput.CriminalConviction" class="field has-field-label-text-align-left is-horizontal-shrink has-field-value-text-align-right"></dc-radio-group>
            <dc-radio-group data-field="viewmodel.fields?.policyHolderDeclaration?.policyHolderDeclarationInput$bankruptcy" data-mode="radio" data-dc-name="PolicyHolderDeclarationInput.Bankruptcy" class="field has-field-label-text-align-left is-horizontal-shrink has-field-value-text-align-left"></dc-radio-group>
          </div>
          <div class="field-container default-all-12" data-if="viewmodel.fields?.policyHolderDeclaration?.policyHolderDeclarationPrivate$showDetails?.value == '1'">
            <dc-text-field data-field="viewmodel.fields?.policyHolderDeclaration?.policyHolderDeclarationInput$fullDetails" class="field all-5" data-dc-name="PolicyHolderDeclarationInput.FullDetails"></dc-text-field>
            <dc-datepicker data-field="viewmodel.fields?.policyHolderDeclaration?.policyHolderDeclarationInput$detailsDate" class="field has-field-value-text-align-right all-4" data-dc-name="PolicyHolderDeclarationInput.DetailsDate"></dc-datepicker>
          </div>
          <div class="field-container default-all-12">
            <dc-radio-group data-field="viewmodel.fields?.policyHolderDeclaration?.policyHolderDeclarationInput$insuranceHeldAtRiskAdd" data-mode="radio" data-dc-name="PolicyHolderDeclarationInput.InsuranceHeldAtRiskAdd" class="field is-horizontal-shrink has-field-label-text-align-left has-field-value-text-align-right"></dc-radio-group>
          </div>
        </div>
      </dc-section>
      <div class="field-container default-all-12">
        <div class="field">
          <div class="control-container default-all-shrink">
            <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.policyHolderDeclaration?.returnToPolicy" data-dc-name="returnToPolicy" mode="button"></dc-action>
          </div>
          <!-- INSERTIONPOINT -->
        </div>
      </div>
    </div>
  </div>
</div>

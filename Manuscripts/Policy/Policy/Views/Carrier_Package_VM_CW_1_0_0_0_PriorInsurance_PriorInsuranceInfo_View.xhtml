<!-- @TYPE=VIEW @ID=Carrier_Package_VM_CW_1_0_0_0_PriorInsurance_PriorInsuranceInfo_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x grid-padding-x grid-padding-y all-12">
    <div class="cell auto">
      <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static has-border">
        <ng-template dc-section-header-template="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto">
            <div class="field">
              <div class="control-container">
                <div class="control is-text">
                  <h2 class="has-text-size-larger has-text-color-white title" data-dc-name="PriorCompetitorInformation" data-innertext="viewmodel.fields?.priorInsuranceInfo?.priorCompetitorInformation?.value"></h2>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <div class="field-container default-all-12">
            <dc-combobox class="field" data-on-change="vm.fieldChanged(viewmodel.fields?.priorInsuranceInfo?.priorInsuranceInfoInput$priorCarrier)" data-field="viewmodel.fields?.priorInsuranceInfo?.priorInsuranceInfoInput$priorCarrier" data-dc-name="PriorInsuranceInfoInput.PriorCarrier"></dc-combobox>
            <dc-text-field data-field="viewmodel.fields?.priorInsuranceInfo?.priorInsuranceInfoInput$price" class="field" data-dc-name="PriorInsuranceInfoInput.Price"></dc-text-field>
            <!-- INSERTIONPOINT -->
          </div>
        </div>
      </dc-section>
      <div class="field-container default-all-12">
        <div class="field">
          <div class="control-container default-all-shrink is-aligned-right">
            <dc-action class="control all-shrink has-padding-medium is-action" data-action="viewmodel.fields?.priorInsuranceInfo?.okAdd" data-dc-name="okAdd" mode="button" data-closespopup="true"></dc-action>
            <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.priorInsuranceInfo?.cancelInsurance" data-dc-name="cancelInsurance" mode="button" data-closespopup="true"></dc-action>
            <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.priorInsuranceInfo?.cancel" data-dc-name="cancel" mode="button" data-closespopup="true"></dc-action>
          </div>
          <!-- INSERTIONPOINT -->
        </div>
      </div>
    </div>
  </div>
</div>

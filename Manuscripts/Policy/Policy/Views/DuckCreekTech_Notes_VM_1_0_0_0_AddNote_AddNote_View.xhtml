<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_Notes_VM_1_0_0_0_AddNote_AddNote_View -->
<div class="panel" pc-type="Panel">
  <div class="field-container has-labels-left default-all-label-width-narrow default-all-12">
    <dc-text-field data-field="viewmodel.fields?._NotesData?.newComment?.newCommentInput$commentSubject" class="field all-10" data-dc-name="NewCommentInput.CommentSubject"></dc-text-field>
    <dc-combobox class="field all-10" data-on-change="vm.fieldChanged(viewmodel.fields?._NotesData?.newComment?.newCommentInput$commentCategory)" data-field="viewmodel.fields?._NotesData?.newComment?.newCommentInput$commentCategory" data-dc-name="NewCommentInput.CommentCategory"></dc-combobox>
    <dc-combobox class="field all-10" data-on-change="vm.fieldChanged(viewmodel.fields?._NotesData?.newComment?.newCommentInput$commentSubCategory)" data-field="viewmodel.fields?._NotesData?.newComment?.newCommentInput$commentSubCategory" data-dc-name="NewCommentInput.CommentSubCategory"></dc-combobox>
    <dc-richtext data-field="viewmodel.fields?._NotesData?.newComment?.newCommentInput$commentText" class="field all-12" data-dc-name="NewCommentInput.CommentText"></dc-richtext>
    <dc-checkbox data-field="viewmodel.fields?._NotesData?.newComment?.newCommentInput$internalOnly" data-dc-name="NewCommentInput.InternalOnly" class="field all-4"></dc-checkbox>
    <div class="field is-merged has-label-hidden">
      <div class="control-container default-all-shrink">
        <div class="control is-text">
          <h2 class="title" data-dc-name="Captions.AttachmentsCaption" data-innertext="viewmodel.fields?._NotesData?.newComment?.newCommentAttachments?.captions$attachmentsCaption?.value"></h2>
        </div>
      </div>
      <!-- INSERTIONPOINT -->
    </div>
    <div class="field has-label-hidden">
      <div class="control-container default-all-shrink">
        <dc-action class="control all-shrink" data-action="viewmodel.fields?._NotesData?.newComment?.newCommentAttachments?.newCommentAttachment?.addAttachment" data-dc-name="addAttachment" mode="hyperlink">
          <ng-template>
            <i class="is-left icon-plus-circle" aria-hidden="true"></i>
          </ng-template>
        </dc-action>
      </div>
      <!-- INSERTIONPOINT -->
    </div>
    <!-- INSERTIONPOINT -->
  </div>
  <dc-hypergrid expandable="true" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?._NotesData?.newComment?.newCommentAttachments?.newCommentAttachment?.rows" data-readonly="false" data-grid-data="viewmodel.fields?._NotesData?.newComment?.newCommentAttachments?.newCommentAttachment?.rows" class="">
    <dc-hypergrid-celldef field="newCommentAttachmentInput$caption" data-dc-name="NewCommentAttachmentInput.Caption" class="">
      <ng-template dc-hypergridcell-template="" let-iterativeitem="">
        <div class="field-container default-all-12">
          <dc-text-field data-field="iterativeItem?.newCommentAttachmentInput$caption" class="field" data-dc-name="NewCommentAttachmentInput.Caption"></dc-text-field>
        </div>
      </ng-template>
    </dc-hypergrid-celldef>
    <dc-hypergrid-celldef field="newCommentAttachmentOutput$fileName" data-dc-name="NewCommentAttachmentOutput.FileName">
      <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
        <div class="field-container default-all-12">
          <dc-string-literal-field class="field" data-dc-name="NewCommentAttachmentOutput.FileName" data-field="iterativeItem?.newCommentAttachmentOutput$fileName"></dc-string-literal-field>
        </div>
      </ng-template>
    </dc-hypergrid-celldef>
    <dc-hypergrid-celldef field="importFile" data-dc-name="importFile" class="">
      <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
        <div class="field-container default-all-12">
          <div class="field">
            <div class="control-container default-all-shrink">
              <dc-file-upload class="is-single-select" data-uploadtype="import" data-policyid="" data-taskid="" multiselect="false" data-action="iterativeItem?.importFile" data-dc-name="importFile" data-if="iterativeItem?.newCommentAttachmentPrivate$isAttachmentNotAdded?.value == '1'"></dc-file-upload>
              <dc-action class="control all-shrink" data-action="iterativeItem?.downloadAttachment" data-dc-name="downloadAttachment" mode="hyperlink"></dc-action>
              <dc-action class="control all-shrink" data-action="iterativeItem?.deleteAttachment" data-dc-name="deleteAttachment" mode="hyperlink"></dc-action>
            </div>
            <!-- INSERTIONPOINT -->
          </div>
        </div>
      </ng-template>
    </dc-hypergrid-celldef>
  </dc-hypergrid>
  <div class="field-container default-all-12">
    <div class="field all-12 has-control-margin-top-largest">
      <!-- INSERTIONPOINT -->
      <div class="control-container default-all-shrink is-aligned-right">
        <dc-action class="control all-shrink is-action" data-action="viewmodel.fields?._NotesData?.newComment?.saveNote" data-dc-name="saveNote" mode="button" data-closespopup="true"></dc-action>
        <dc-action class="control all-shrink" data-action="viewmodel.fields?._NotesData?.newComment?.cancelAddNote" data-dc-name="cancelAddNote" mode="button" data-closespopup="true"></dc-action>
      </div>
    </div>
  </div>
</div>

<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=SME_AU_1_0_0_0_PriorInsurance_LossHistoryList_View -->
<div class="dc-page" dc-page="">

          </div>

              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="claimInformationInput$claimStatus" data-dc-name="ClaimInformationInput.ClaimStatus" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">

            <dc-hypergrid-celldef field="details" data-dc-name="details" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">

                    <div class="control-container default-all-shrink">
                      <dc-action class="control has-padding-medium is-action" data-action="iterativeItem?.details" data-dc-name="details" mode="button" data-openpopup="true" data-popupsize="is-large" data-closespopup="false">

                      </dc-action>
                    </div>
                    <!-- INSERTIONPOINT -->
                  </div>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>

                      <dc-action class="control all-shrink has-padding-medium is-clear has-text-hidden" data-action="iterativeItem?.deleteLoss" data-dc-name="deleteLoss" mode="hyperlink">

                          <i class="is-left icon-trashcan" aria-hidden="true"></i>

                    <!-- INSERTIONPOINT -->
                  </div>

        <div class="field">
          <div class="control-container default-all-shrink">
            <dc-action class="control all-shrink has-padding-medium is-action" data-action="viewmodel.fields?.lossHistory?.addLoss" data-dc-name="addLoss" mode="button" data-openpopup="true" data-popupsize="is-large"></dc-action>
            <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.lossHistory?.returnToPolicy" data-dc-name="returnToPolicy" mode="button"></dc-action>

          <!-- INSERTIONPOINT -->
        </div>

<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_ADCPackage_Pages_CW_1_0_0_0_PriorInsurance_LossHistoryList_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x grid-padding-x grid-padding-y all-12">
    <div class="cell auto">
      <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static">
        <ng-template dc-section-header-template="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto">
            <div class="field">
              <div class="control-container">
                <div class="control is-text">
                  <h1 class="title has-text-size-larger" data-dc-name="LossHistory" data-innertext="viewmodel.fields?.lossHistoryLabel?.lossHistory?.value"></h1>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <div class="field-container default-all-3">
            <dc-string-literal-field class="has-label-hidden field is-aligned-right all-9" data-dc-name="ClaimInformationInput.LosssHistoryInfoMessage" data-field="viewmodel.fields?.lossHistoryLabel?.claimInformationInput$losssHistoryInfoMessage"></dc-string-literal-field>
            <dc-text-field data-field="viewmodel.fields?.lossHistoryLabel?.lossHistoryPage$pastLossYear" class="field has-label-hidden is-aligned-left all-1" data-dc-name="LossHistoryPage.PastLossYear"></dc-text-field>
            <dc-string-literal-field class="has-label-hidden is-aligned-left field all-1" data-dc-name="ClaimInformationInput.LosssHistoryInfoYearsLabel" data-field="viewmodel.fields?.lossHistoryLabel?.claimInformationInput$losssHistoryInfoYearsLabel"></dc-string-literal-field>
            <!-- INSERTIONPOINT -->
          </div>
          <dc-hypergrid expandable="true" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?.lossHistory?.rows" data-readonly="true" data-grid-data="viewmodel.fields?.lossHistory?.rows" class="">
            <dc-hypergrid-celldef field="generalInformationInput$lossOccurrenceDate" data-dc-name="GeneralInformationInput.LossOccurrenceDate" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
                <div class="field-container default-all-12">
                  <dc-datepicker data-field="iterativeItem?.generalInformationInput$lossOccurrenceDate" class="field" data-dc-name="GeneralInformationInput.LossOccurrenceDate"></dc-datepicker>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="generalInformationInput$lineOfLoss" data-dc-name="GeneralInformationInput.LineOfLoss" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
                <div class="field-container default-all-12">
                  <dc-text-field data-field="iterativeItem?.generalInformationInput$lineOfLoss" class="field" data-dc-name="GeneralInformationInput.LineOfLoss"></dc-text-field>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="details" data-dc-name="details" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
                <div class="field-container default-all-12">
                  <div class="field">
                    <div class="control-container default-all-shrink">
                      <dc-action class="control all-shrink has-padding-medium has-text-hidden" data-action="iterativeItem?.details" data-dc-name="details" mode="hyperlink" data-openpopup="true" data-popupsize="is-large">
                        <ng-template>
                          <i class="icon-file-notepad-pencil has-icon-align-center" aria-hidden="true"></i>
                        </ng-template>
                      </dc-action>
                    </div>
                    <!-- INSERTIONPOINT -->
                  </div>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
            <dc-hypergrid-celldef field="deleteLoss" data-dc-name="deleteLoss" class="">
              <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                <div class="field-container default-all-12">
                  <div class="field">
                    <div class="control-container default-all-shrink">
                      <dc-action class="control all-shrink has-padding-medium has-text-hidden" data-action="iterativeItem?.deleteLoss" data-dc-name="deleteLoss" mode="hyperlink">
                        <ng-template>
                          <i class="icon-trashcan has-icon-align-center" aria-hidden="true"></i>
                        </ng-template>
                      </dc-action>
                    </div>
                    <!-- INSERTIONPOINT -->
                  </div>
                </div>
              </ng-template>
            </dc-hypergrid-celldef>
          </dc-hypergrid>
        </div>
      </dc-section>
      <div class="field-container default-all-12">
        <div class="field">
          <div class="control-container default-all-shrink">
            <dc-action class="control all-shrink has-padding-medium is-action" data-action="viewmodel.fields?.lossHistory?.addLoss" data-dc-name="addLoss" mode="button" data-openpopup="true" data-popupsize="is-large"></dc-action>
            <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.lossHistory?.returnToPolicy" data-dc-name="returnToPolicy" mode="button"></dc-action>
          </div>
          <!-- INSERTIONPOINT -->
        </div>
      </div>
    </div>
  </div>
</div>

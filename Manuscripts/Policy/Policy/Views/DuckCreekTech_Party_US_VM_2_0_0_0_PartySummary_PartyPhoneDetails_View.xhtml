<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_Party_US_VM_2_0_0_0_PartySummary_PartyPhoneDetails_View -->
<dc-section data-expandable="false" data-expand-eventfield="" class="is-static has-border-none pc-selectedelement has-margin-bottom-smallest" pc-type="Section" data-expanded="true" draggable="true">
  <ng-template dc-section-header-template="" class="has-border-bottom">
    <div class="field-container section-header-field-container default-all-12" data-repeat="let iterativeItem of viewmodel.fields?.partyRecord?.rows" data-dc-iterative="viewmodel.fields?.partyRecord?.rows">
      <div class="field">
        <div class="control-container default-all-shrink">
          <div class="control is-text">
            <h3 class="title" data-dc-name="Localization.PhonesCaption" data-innertext="viewmodel.fields?.partyRecord?.localization$phonesCaption?.value"></h3>
          </div>
        </div>
        <!-- INSERTIONPOINT -->
      </div>
    </div>
  </ng-template>
  <div class="body dc-section__body has-padding-top-none has-padding-bottom-none">
    <div class="field-container default-all-12" data-repeat="let iterativeItem of viewmodel.fields?.partyRecord?.rows" data-dc-iterative="viewmodel.fields?.partyRecord?.rows" data-if="viewmodel.fields?._PartyData?._PartyData$partyEditEnabled.value == '1'">
      <div class="field all-shrink has-margin-bottom-none has-label-hidden">
        <div class="control-container default-all-shrink">
          <dc-action class="control all-shrink has-padding-medium" data-action="iterativeItem?.addPhone" data-dc-name="addPhone" mode="hyperlink" data-openpopup="true">
            <ng-template>
              <i class="is-left has-icon-color-highlight icon-plus-circle"></i>
            </ng-template>
          </dc-action>
        </div>
        <!-- INSERTIONPOINT -->
      </div>
    </div>
    <dc-hypergrid expandable="true" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?.partyPhone?.rows" data-readonly="true" data-grid-data="viewmodel.fields?.partyPhone?.rows" class="" data-paginginfo="" data-currentaction="" data-objectref="" data-id="">
      <dc-hypergrid-celldef field="partyPhoneInput$phoneTypeCode" data-dc-name="PartyPhoneInput.PhoneTypeCode" class="table-cell--width20">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="all-12 field has-text-size-smaller" data-dc-name="PartyPhoneInput.PhoneTypeCode" data-field="iterativeItem?.partyPhoneInput$phoneTypeCode"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="partyPhoneInput$phoneNumber" data-dc-name="PartyPhoneInput.PhoneNumber" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="all-12 field has-text-size-smaller" data-dc-name="PartyPhoneInput.PhoneNumber" data-field="iterativeItem?.partyPhoneInput$phoneNumber"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="partyPhoneInput$phoneExtension" data-dc-name="PartyPhoneInput.PhoneExtension" class="table-cell--width5">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="all-12 field has-text-size-smaller" data-dc-name="PartyPhoneInput.PhoneExtension" data-field="iterativeItem?.partyPhoneInput$phoneExtension"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="partyPhoneInput$phoneCountryCode" data-dc-name="PartyPhoneInput.PhoneCountryCode" class="table-cell--width12">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field has-text-size-smaller all-12" data-dc-name="PartyPhoneInput.PhoneCountryCode" data-field="iterativeItem?.partyPhoneInput$phoneCountryCode"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="partyPhoneWorkingData$contactHours" data-dc-name="PartyPhoneWorkingData.ContactHours" class="table-cell--width17">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="all-12 field has-text-size-smaller" data-dc-name="PartyPhoneWorkingData.ContactHours" data-field="iterativeItem?.partyPhoneWorkingData$contactHours"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="partyPhoneWorkingData$gridPrimaryIndicator" data-dc-name="PartyPhoneWorkingData.GridPrimaryIndicator" class="table-cell--width12">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-checkbox data-field="iterativeItem?.partyPhoneWorkingData$gridPrimaryIndicator" data-dc-name="PartyPhoneWorkingData.GridPrimaryIndicator" class="field all-12"></dc-checkbox>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="correct" data-dc-name="correct" class="table-cell--width15" bind-show="viewmodel.fields?._PartyData?._PartyData$partyEditEnabled">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12 has-labels-hidden">
            <div class="field has-label-hidden">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink is-clear has-text-hidden has-width-auto" data-action="iterativeItem?.correct" data-dc-name="correct" mode="button" data-openpopup="true">
                  <ng-template>
                    <i class="is-left icon-file-notepad-pencil"></i>
                  </ng-template>
                </dc-action>
                <dc-action class="control all-shrink is-clear has-text-hidden" data-action="iterativeItem?.delete" data-dc-name="delete" mode="button">
                  <ng-template>
                    <i class="is-left icon-trashcan"></i>
                  </ng-template>
                </dc-action>
                <dc-action class="control all-shrink is-clear has-text-hidden" data-action="iterativeItem?.markPrimary" data-dc-name="markPrimary" mode="button">
                  <ng-template>
                    <i class="is-left icon-check"></i>
                  </ng-template>
                </dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <ng-template dc-hypergridrowdetail-template="" let-iterativeitem="" class="">
        <dc-section data-expandable="false" data-expand-eventfield="" class="dc-section is-static" data-if="iterativeItem?.partyPhoneWorkingData$hasComments?.value == '1'">
          <!-- INSERTIONPOINT -->
          <div class="body dc-section__body">
            <div class="field-container default-all-12">
              <dc-string-literal-field class="field has-padding-left-large" data-dc-name="PhoneExtendedData.PhoneComments" data-field="iterativeItem?.phoneExtendedData$phoneComments"></dc-string-literal-field>
              <!-- INSERTIONPOINT -->
            </div>
          </div>
        </dc-section>
      </ng-template>
    </dc-hypergrid>
  </div>
</dc-section>

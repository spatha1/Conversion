<!-- @TYPE=VIEW @ID=DuckCreekTech_CommercialMotor_AU_VM_1_0_0_0_MainInterview_Vehicle_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x all-12">
    <div class="cell auto">
      <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static">
        <ng-template dc-section-header-template="" class="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto">
            <dc-string-literal-field class="field" data-dc-name="Vehicle" data-field="viewmodel.fields?.line?.vehicle"></dc-string-literal-field>
          </div>
        </ng-template>
        <div class="body dc-section__body has-border-none">
          <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static has-border-none" data-repeat="let iterativeItem of viewmodel.fields?.line?.rows" data-dc-iterative="viewmodel.fields?.line?.rows">
            <div class="body dc-section__body">
              <div class="field-container default-all-12">
                <dc-combobox class="field all-6" data-on-change="vm.fieldChanged(viewmodel.fields?.address?.locationOutput$allLocations)" data-field="viewmodel.fields?.address?.locationOutput$allLocations" data-dc-name="LocationOutput.AllLocations"></dc-combobox>
                <div class="field all-shrink">
                  <div class="control-container default-all-shrink">
                    <dc-action class="control all-shrink has-padding-medium" data-action="iterativeItem?.risk?.addVehicle" data-dc-name="addVehicle" mode="button" data-openpopup="true"></dc-action>
                  </div>
                  <!-- INSERTIONPOINT -->
                </div>
                <!-- INSERTIONPOINT -->
              </div>
              <dc-hypergrid expandable="true" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?.line?.rows?.risk?.rows" data-readonly="true" data-grid-data="iterativeItem?.risk?.rows" class="has-banding-even" banding="true">
                <dc-hypergrid-celldef field="riskOutput$locationDescription" data-dc-name="RiskOutput.LocationDescription" class="table-cell--width20">
                  <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
                    <div class="field-container default-all-12">
                      <dc-text-field data-field="iterativeItem?.riskOutput$locationDescription" class="field" data-dc-name="RiskOutput.LocationDescription"></dc-text-field>
                    </div>
                  </ng-template>
                </dc-hypergrid-celldef>
                <dc-hypergrid-celldef field="vehicleOutput$vehicleFullDescription" data-dc-name="VehicleOutput.VehicleFullDescription" class="">
                  <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
                    <div class="field-container default-all-12">
                      <dc-text-field data-field="iterativeItem?.vehicleOutput$vehicleFullDescription" class="field has-field-label-text-overflow-wrap" data-dc-name="VehicleOutput.VehicleFullDescription"></dc-text-field>
                    </div>
                  </ng-template>
                </dc-hypergrid-celldef>
                <dc-hypergrid-celldef field="edit" data-dc-name="edit" class="table-cell--width20">
                  <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
                    <div class="field-container default-all-12">
                      <div class="field">
                        <div class="control-container default-all-shrink">
                          <dc-action class="control has-padding-medium is-action" data-action="iterativeItem?.edit" data-dc-name="edit" mode="button" data-openpopup="true" data-popupsize="is-larger">
                            <ng-template>
                              <i class="is-left icon-car" aria-hidden="true"></i>
                            </ng-template>
                          </dc-action>
                        </div>
                        <!-- INSERTIONPOINT -->
                      </div>
                    </div>
                  </ng-template>
                </dc-hypergrid-celldef>
                <dc-hypergrid-celldef field="delete" data-dc-name="delete" class="table-cell--width10">
                  <ng-template dc-hypergridcell-template="" let-iterativeitem="">
                    <div class="field-container default-all-12">
                      <div class="field">
                        <div class="control-container default-all-shrink">
                          <dc-action class="control all-shrink has-padding-medium" data-action="iterativeItem?.delete" data-dc-name="delete" mode="hyperlink">
                            <ng-template>
                              <i class="is-left icon-trashcan" aria-hidden="true"></i>
                            </ng-template>
                          </dc-action>
                        </div>
                        <!-- INSERTIONPOINT -->
                      </div>
                    </div>
                  </ng-template>
                </dc-hypergrid-celldef>
              </dc-hypergrid>
            </div>
          </dc-section>
        </div>
      </dc-section>
    </div>
  </div>
</div>

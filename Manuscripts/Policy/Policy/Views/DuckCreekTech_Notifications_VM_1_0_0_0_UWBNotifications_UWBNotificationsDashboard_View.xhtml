<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_Notifications_VM_1_0_0_0_UWBNotifications_UWBNotificationsDashboard_View -->
<dc-section data-expandable="true" data-expanded="true" data-expand-eventfield="" class="pc-selectedelement" draggable="true">
  <ng-template dc-section-header-template="">
    <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto">
      <div class="field">
        <div class="control-container">
          <div class="control is-text">
            <h2 class="title" data-dc-name="Notifications" data-innertext="viewmodel.fields?._NotificationsData?.notifications?.value"></h2>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
  <div class="body dc-section__body">
    <dc-hypergrid expandable="true" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?._NotificationsData?.messages?.message?.rows" data-readonly="true" data-grid-data="viewmodel.fields?._NotificationsData?.messages?.message?.rows" class="" show-empty-grid-message="true" data-dc-name="Captions.NotificationEmptyGridMsg" data-empty-grid-message="viewmodel.fields?._NotificationsData?.captions$notificationEmptyGridMsg?.value">
      <dc-hypergrid-celldef field="messageInput$action" data-dc-name="MessageInput.Action" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="MessageInput.Action" data-field="iterativeItem?.messageInput$action"></dc-string-literal-field>
          </div>
        </ng-template>
        <ng-template dc-hypergridheadercell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="Type" data-field="viewmodel.fields?._NotificationsData?.messages?.type"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="viewNotification" data-dc-name="viewNotification" class="">
        <ng-template dc-hypergridheadercell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="MessageTitle" data-field="viewmodel.fields?._NotificationsData?.messages?.messageTitle"></dc-string-literal-field>
          </div>
        </ng-template>
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <div class="field">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink" data-action="iterativeItem?.viewNotification" data-dc-name="viewNotification" mode="hyperlink" data-openpopup="true"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="messageInput$sentOn" data-dc-name="MessageInput.SentOn" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="MessageInput.SentOn" data-field="iterativeItem?.messageInput$sentOn"></dc-string-literal-field>
          </div>
        </ng-template>
        <ng-template dc-hypergridheadercell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="Received" data-field="viewmodel.fields?._NotificationsData?.messages?.received"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
    </dc-hypergrid>
    <div class="field-container default-all-12">
      <div class="field">
        <div class="control-container default-all-shrink">
          <dc-action class="control all-shrink" data-action="viewmodel.fields?._NotificationsData?.messages?.viewAllNotification" data-dc-name="viewAllNotification" mode="button"></dc-action>
        </div>
        <!-- INSERTIONPOINT -->
      </div>
      <!-- INSERTIONPOINT -->
    </div>
  </div>
</dc-section>

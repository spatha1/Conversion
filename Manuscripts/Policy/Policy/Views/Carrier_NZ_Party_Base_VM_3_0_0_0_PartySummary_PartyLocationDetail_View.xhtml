<!-- @TYPE=VIEW @ID=Carrier_NZ_Party_Base_VM_3_0_0_0_PartySummary_PartyLocationDetail_View -->
<dc-section data-expandable="false" data-expand-eventfield="" class="is-static has-padding-none has-border pc-selectedelement has-margin-right-large" pc-type="Section">
  <ng-template dc-section-header-template="" class="has-border-bottom">
    <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto" data-repeat="let iterativeItem of viewmodel.fields?.partyRecord?.rows" data-dc-iterative="viewmodel.fields?.partyRecord?.rows">
      <div class="field">
        <div class="control-container default-all-shrink">
          <div class="control is-text">
            <h2 class="title has-text-color-white" data-dc-name="Localization.Addresses" data-innertext="viewmodel.fields?.partyRecord?.localization$addresses?.value"></h2>
          </div>
        </div>
        <!-- INSERTIONPOINT -->
      </div>
    </div>
  </ng-template>
  <div class="body dc-section__body">
    <div class="field-container default-all-12 default-small-6 default-medium-4 default-large-3 has-labels-left" data-repeat="let iterativeItem of viewmodel.fields?.partyRecord?.rows" data-dc-iterative="viewmodel.fields?.partyRecord?.rows" data-if="viewmodel.fields?._PartyData?._PartyData$partyEditEnabled.value == '1'">
      <dc-combobox class="field" data-on-change="vm.fieldChanged(iterativeItem?.general$viewByLocation)" data-field="iterativeItem?.general$viewByLocation" data-dc-name="General.ViewByLocation"></dc-combobox>
      <!-- INSERTIONPOINT -->
    </div>
    <dc-hypergrid expandable="true" on-pagechanged="processActions($event)" data-dc-iterative="viewmodel.fields?.location?.rows" data-readonly="true" data-grid-data="viewmodel.fields?.location?.rows" class="is-condensed has-border-color-black">
      <dc-hypergrid-celldef field="locationInput$locationAddressLine1" data-dc-name="LocationInput.LocationAddressLine1" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="LocationInput.LocationAddressLine1" data-field="iterativeItem?.locationInput$locationAddressLine1"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="locationInput$locationCity" data-dc-name="LocationInput.LocationCity" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="LocationInput.LocationCity" data-field="iterativeItem?.locationInput$locationCity"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="locationInput$locationStateCode" data-dc-name="LocationInput.LocationStateCode" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="">
          <div class="field-container default-all-12">
            <dc-text-field data-field="iterativeItem?.locationInput$locationAddressLine4" class="field" data-dc-name="LocationInput.LocationAddressLine4"></dc-text-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="locationInput$locationPostalCode" data-dc-name="LocationInput.LocationPostalCode" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="LocationInput.LocationPostalCode" data-field="iterativeItem?.locationInput$locationPostalCode"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="locationInput$locationCountryCode" data-dc-name="LocationInput.LocationCountryCode" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="field" data-dc-name="LocationInput.LocationCountryCode" data-field="iterativeItem?.locationInput$locationCountryCode"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="locationInput$locationEffectiveDate" data-dc-name="AllLocationInvolvements.DisplayLocationInvolvementEffectiveDate" class="table-cell--width12">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="all-12 field has-text-size-smaller" data-dc-name="LocationInput.LocationEffectiveDate" data-field="iterativeItem?.locationInput$locationEffectiveDate"></dc-string-literal-field>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="locationInput$locationExpirationDate" data-dc-name="AllLocationInvolvements.DisplayLocationExpirationDate" class="table-cell--width12">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12">
            <dc-string-literal-field class="all-12 field has-text-size-smaller" data-dc-name="LocationInput.LocationExpirationDate" data-field="iterativeItem?.locationInput$locationExpirationDate"></dc-string-literal-field>
            <dc-datepicker data-field="iterativeItem?.locationInvolvementWorkingData$displayLocationExpirationDate" class="field all-12" data-dc-name="LocationInvolvementWorkingData.DisplayLocationExpirationDate"></dc-datepicker>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="locationInput$primaryIndicator" data-dc-name="LocationInput.PrimaryIndicator" class="">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="">
          <div class="field-container default-all-12">
            <dc-checkbox data-field="iterativeItem?.locationInput$primaryIndicator" data-dc-name="LocationInput.PrimaryIndicator" class="field all-12"></dc-checkbox>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <dc-hypergrid-celldef field="correct" data-dc-name="correct" class="" bind-show="viewmodel.fields?._PartyData?._PartyData$partyEditEnabled">
        <ng-template dc-hypergridcell-template="" let-iterativeitem="" class="">
          <div class="field-container default-all-12" data-if="viewmodel.fields?.partyRecord?.expressPrivate$selectClientInformationFlase?.value == '1'">
            <div class="field all-12">
              <div class="control-container default-all-shrink">
                <dc-action class="control has-padding-medium is-clear has-text-hidden" data-action="iterativeItem?.correct" data-dc-name="correct" mode="button" data-openpopup="true">
                  <ng-template>
                    <i class="is-left icon-pencil"></i>
                  </ng-template>
                </dc-action>
                <dc-action class="control has-padding-medium is-clear has-text-hidden" data-action="iterativeItem?.delete" data-dc-name="delete" mode="button">
                  <ng-template>
                    <i class="is-left icon-trashcan"></i>
                  </ng-template>
                </dc-action>
                <dc-action class="control has-padding-medium is-clear has-text-hidden" data-action="iterativeItem?.markPrimary" data-dc-name="markPrimary" mode="button">
                  <ng-template>
                    <i class="is-left icon-check"></i>
                  </ng-template>
                </dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
          </div>
        </ng-template>
      </dc-hypergrid-celldef>
      <ng-template dc-hypergridrowdetail-template="" let-iterativeitem="" class="">
        <dc-section data-expandable="false" data-expanded="false" data-expand-eventfield="" class="is-static">
          <div class="body dc-section__body">
            <div class="field-container default-all-12">
              <dc-string-literal-field class="field has-text-bold has-padding-bottom-none has-margin-bottom-none has-text-size-smaller" data-dc-name="Localization.AddressTypeCaption" data-field="iterativeItem?.localization$addressTypeCaption"></dc-string-literal-field>
              <dc-string-literal-field class="field has-label-hidden" data-dc-name="LocationWorkingData.DisplayTypeCodeConcatCS" data-field="iterativeItem?.locationWorkingData$displayTypeCodeConcatCS"></dc-string-literal-field>
              <dc-string-literal-field class="field all-hide" data-dc-name="GlobalStrings.Space" data-field="iterativeItem?.globalStrings$space"></dc-string-literal-field>
              <dc-string-literal-field class="field all-hide" data-dc-name="Localization.CommentsCaption" data-field="iterativeItem?.localization$commentsCaption"></dc-string-literal-field>
              <dc-string-literal-field class="field" data-dc-name="LocationInput.LocationComments" data-field="iterativeItem?.locationInput$locationComments"></dc-string-literal-field>
            </div>
          </div>
        </dc-section>
      </ng-template>
    </dc-hypergrid>
    <div class="field-container default-all-12" data-repeat="let iterativeItem of viewmodel.fields?.partyRecord?.rows" data-dc-iterative="viewmodel.fields?.partyRecord?.rows">
      <div class="field" data-if="viewmodel.fields?.partyRecord?.expressPrivate$selectClientInformationFlase?.value == '1'">
        <div class="control-container default-all-shrink is-aligned-right">
          <dc-action class="control all-shrink has-padding-medium is-action" data-action="iterativeItem?.addLocation" data-dc-name="addLocation" mode="button" data-openpopup="true">
            <ng-template></ng-template>
          </dc-action>
        </div>
        <!-- INSERTIONPOINT -->
      </div>
    </div>
  </div>
</dc-section>

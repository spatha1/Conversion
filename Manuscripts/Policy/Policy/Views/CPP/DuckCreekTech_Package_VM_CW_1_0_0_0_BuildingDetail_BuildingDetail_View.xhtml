<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_Package_VM_CW_1_0_0_0_BuildingDetail_BuildingDetail_View -->
<div class="dc-page dc-page--topNav" dc-page="">
  <main class="dc-main">
    <div class="grid-x small-12">
      <div class="cell auto has-padding-none" dc-cell="">
        <dc-section data-expanded="true" data-expandable="false" data-expand-eventfield="" class="has-border-none has-margin-none" data-if="viewmodel.fields?.building?.eliminate?.buildingOutputNonShredded$inEditMode?.value == '1'">
          <div class="body dc-section__body">
            <!-- INSERTIONPOINT -->
            <div class="field-container default-all-12">
              <dc-text-field data-field="viewmodel.fields?.building?.eliminate?.buildingOutputNonShredded$numberDisplay" data-dc-name="BuildingOutputNonShredded.NumberDisplay" class="field all-1"></dc-text-field>
              <dc-text-field data-field="viewmodel.fields?.building?.eliminate?.buildingInput$description" data-dc-name="BuildingInput.Description" class="field all-11"></dc-text-field>
            </div>
            <div class="field-container default-all-3">
              <dc-text-field data-field="viewmodel.fields?.building?.eliminate?.buildingInput$yearBuilt" data-dc-name="BuildingInput.YearBuilt" class="field"></dc-text-field>
              <dc-text-field data-field="viewmodel.fields?.building?.eliminate?.buildingInput$numberOfStories" data-dc-name="BuildingInput.NumberOfStories" class="field"></dc-text-field>
              <dc-text-field data-field="viewmodel.fields?.building?.eliminate?.buildingInput$squareFt" data-dc-name="BuildingInput.SquareFt" class="field"></dc-text-field>
            </div>
            <div class="field-container default-all-12">
              <dc-combobox data-field="viewmodel.fields?.building?.eliminate?.buildingInput$constructionCode" data-dc-name="BuildingInput.ConstructionCode" data-on-change="vm.fieldChanged(viewmodel.fields?.building?.eliminate?.buildingInput$constructionCode)" class="field all-3"></dc-combobox>
              <dc-checkbox data-field="viewmodel.fields?.building?.eliminate?.buildingInput$sprinkler" data-dc-name="BuildingInput.Sprinkler" class="field all-shrink"></dc-checkbox>
            </div>
            <div class="field-container default-all-12">
              <div class="field all-12">
                <div class="control-container default-all-shrink has-same-width">
                  <dc-action data-action="viewmodel.fields?.building?.eliminate?.oK_1" data-dc-name="OK_1" mode="button" class="control" data-closespopup="true"></dc-action>
                  <dc-action data-action="viewmodel.fields?.building?.eliminate?.cancel_1" data-dc-name="Cancel_1" mode="button" class="control" data-closespopup="true"></dc-action>
                  <dc-action data-action="viewmodel.fields?.building?.eliminate?.cancel_2" data-dc-name="Cancel_2" mode="button" class="control" data-closespopup="true"></dc-action>
                </div>
              </div>
            </div>
          </div>
        </dc-section>
      </div>
    </div>
  </main>
</div>

<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DCT_SampleProduct_3_0_0_0_MainInterview_PolicyDetail_View -->
<div class="dc-page" dc-page="">
  
    <div class="grid-x grid-padding-x grid-padding-y small-12">
      <div class="cell all-12" dc-cell="">
        <dc-section data-expandable="false" data-expand-eventfield="" class="is-static">
          <ng-template dc-section-header-template="" class="">
            <div pc-dnr="" class="section-header-field-container field-container default-all-12 all-auto">
              <dc-string-literal-field class="field title has-text-size-large" data-dc-name="PolicyDetailPage.PolicyTermHeader" data-field="viewmodel.fields?.userInterface?.policyDetailPage$policyTermHeader"></dc-string-literal-field>
            </div>
          </ng-template>
          <div class="body dc-section__body">
            <div class="field-container">
              <dc-text-field data-field="viewmodel.fields?.policy?.policyInput$description" class="field all-12" data-dc-name="PolicyInput.Description"></dc-text-field>
              <!-- INSERTIONPOINT -->
            </div>
            <div class="field-container default-all-12">
              <dc-datepicker data-field="viewmodel.fields?.policy?.policyInput$effectiveDate" class="field medium-4 small-6 x-small-12 all-12" data-dc-name="PolicyInput.EffectiveDate"></dc-datepicker>
              <dc-combobox class="field medium-4 small-6 x-small-12 all-12" data-on-change="vm.fieldChanged(viewmodel.fields?.policy?.policyInput$term)" data-field="viewmodel.fields?.policy?.policyInput$term" data-dc-name="PolicyInput.Term"></dc-combobox>
              <dc-datepicker data-field="viewmodel.fields?.policy?.policyInput$expirationDate" class="field medium-4 small-6 x-small-12 all-12" data-dc-name="PolicyInput.ExpirationDate"></dc-datepicker>
            </div>
            <div class="field-container default-all-12">
              <dc-checkbox data-field="viewmodel.fields?.policy?.policyInput$isAuditable" data-dc-name="PolicyInput.IsAuditable" class="field all-12 medium-4 small-6 x-small-12"></dc-checkbox>
            </div>
            <div class="field-container default-all-12">
              <dc-combobox class="field medium-4 small-6 x-small-12 all-12" data-on-change="vm.fieldChanged(viewmodel.fields?.policy?.policyInput$auditPeriod)" data-field="viewmodel.fields?.policy?.policyInput$auditPeriod" data-dc-name="PolicyInput.AuditPeriod"></dc-combobox>
              <dc-string-literal-field class="field all-12" data-dc-name="UserInterface.Disclaimer" data-field="viewmodel.fields?.userInterface?.userInterface$disclaimer"></dc-string-literal-field>
            </div>
          </div>
        </dc-section>
      </div>
    </div>
  
</div>

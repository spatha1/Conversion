<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DCT_SampleProduct_3_0_0_0_MainInterview_Account_View -->
<div class="dc-page" dc-page="">
  <div class="grid-x small-12">
    <div class="cell all-12" dc-cell="">
      <dc-section data-expandable="false" data-expand-eventfield="" class="is-static has-scrolling">
        <ng-template dc-section-header-template="" class="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-12 all-auto">
            <dc-string-literal-field class="field title has-text-size-large" data-dc-name="AccountPage.ApplicantHeader" data-field="viewmodel.fields?.account?.accountPage$applicantHeader"></dc-string-literal-field>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <div class="field-container">
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$lastName" class="field all-11" data-dc-name="AccountInput.LastName"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$name" class="field all-11" data-dc-name="AccountInput.Name"></dc-text-field>
            <div class="field all-1 has-control-padding-top-small">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink is-clear has-text-hidden" data-action="viewmodel.fields?.account?.autoPartySearchAction" data-dc-name="autoPartySearchAction" mode="button" data-openpopup="true">
                  <ng-template>
                    <i class="is-left icon-search"></i>
                  </ng-template>
                </dc-action>
                <dc-action class="control all-shrink is-clear has-text-hidden" data-action="viewmodel.fields?.account?.manualPartySearchAction" data-dc-name="manualPartySearchAction" mode="button" data-openpopup="true">
                  <ng-template>
                    <i class="is-left icon-search"></i>
                  </ng-template>
                </dc-action>
              </div>
              <div class="label is-invisible">
                <label class="label--text"> </label>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <dc-combobox class="field all-12" data-on-change="vm.fieldChanged(viewmodel.fields?.account?.accountInput$countryCode)" data-field="viewmodel.fields?.account?.accountInput$countryCode" data-dc-name="AccountInput.CountryCode"></dc-combobox>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$address1" class="field all-12" data-dc-name="AccountInput.Address1"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$address2" class="field all-12" data-dc-name="AccountInput.Address2"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$city" class="field medium-4 small-12 x-small-12 all-12" data-dc-name="AccountInput.City"></dc-text-field>
            <dc-combobox class="field medium-4 small-6 x-small-12 all-12" data-on-change="vm.fieldChanged(viewmodel.fields?.account?.accountInput$state)" data-field="viewmodel.fields?.account?.accountInput$state" data-dc-name="AccountInput.State"></dc-combobox>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$zipCode" class="field medium-4 small-6 x-small-12 all-12" data-dc-name="AccountInput.ZipCode"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$primaryPhone" class="field all-12" data-dc-name="AccountInput.PrimaryPhone"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$email" class="field all-12" data-dc-name="AccountInput.Email"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$businessPhone" class="field all-11" data-dc-name="AccountInput.BusinessPhone"></dc-text-field>
            <div class="field all-1 has-control-padding-top-small">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink is-clear has-text-hidden" data-action="viewmodel.fields?.account?.addPartyAction" data-dc-name="addPartyAction" mode="button">
                  <ng-template>
                    <i class="icon-plus"></i>
                  </ng-template>
                </dc-action>
                <dc-action class="control all-shrink is-clear has-text-hidden" data-action="viewmodel.fields?.account?.updatePartyAction" data-dc-name="updatePartyAction" mode="button">
                  <ng-template>
                    <i class="is-left icon-pencil"></i>
                  </ng-template>
                </dc-action>
              </div>
              <div class="label is-invisible">
                <label class="label--text"> </label>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <!-- INSERTIONPOINT -->
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$writingCompany" class="field small-6 x-small-12 all-12" data-dc-name="AccountInput.WritingCompany"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$branchOffice" class="field small-6 all-12 x-small-12" data-dc-name="AccountInput.BranchOffice"></dc-text-field>
            <dc-string-literal-field class="field all-12" data-dc-name="UserInterface.Disclaimer" data-field="viewmodel.fields?.userInterface?.userInterface$disclaimer"></dc-string-literal-field>
          </div>
          <div class="field-container default-all-12">
            <div class="field all-12">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink" data-action="viewmodel.fields?.account?.riskDashboardAction" data-dc-name="riskDashboardAction" mode="button"></dc-action>
                <dc-action class="control all-shrink" data-action="viewmodel.fields?.account?.viewMapAction" data-dc-name="viewMapAction" mode="button"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
          </div>
          <div class="field-container default-all-12">
            <div class="field all-12">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink" data-action="viewmodel.fields?.account?.verifyAction" data-dc-name="verifyAction" mode="button"></dc-action>
                <dc-action class="control all-shrink" data-action="viewmodel.fields?.account?.editAddressAction" data-dc-name="editAddressAction" mode="button"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
          </div>
        </div>
      </dc-section>
    </div>
  </div>
</div>

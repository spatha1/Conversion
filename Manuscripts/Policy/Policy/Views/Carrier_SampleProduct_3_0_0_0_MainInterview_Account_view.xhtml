<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=Carrier_SampleProduct_3_0_0_0_MainInterview_Account_view -->
<div class="dc-page" dc-page="">
  <div class="grid-x grid-padding-x grid-padding-y small-12">
    <div class="cell auto">
      <dc-section data-expandable="false" data-expand-eventfield="" class="is-static">
        <ng-template dc-section-header-template="" class="">
          <div pc-dnr="" class="section-header-field-container field-container default-all-shrink all-auto">
            <dc-string-literal-field class="field all-12" data-dc-name="AccountPage.ApplicantHeader" data-field="viewmodel.fields?.account?.accountPage$applicantHeader"></dc-string-literal-field>
          </div>
        </ng-template>
        <div class="body dc-section__body">
          <div class="field-container">
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$lastName" class="field all-12" data-dc-name="AccountInput.LastName" data-dctrack="false"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$name" class="field all-12" data-dc-name="AccountInput.Name" data-dctrack="false"></dc-text-field>
            <dc-combobox class="field all-12" data-on-change="vm.fieldChanged(viewmodel.fields?.account?.accountInput$countryCode)" data-field="viewmodel.fields?.account?.accountInput$countryCode" data-dc-name="AccountInput.CountryCode" data-dctrack="true"></dc-combobox>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$address1" class="field all-12" data-dc-name="AccountInput.Address1" data-dctrack="true" data-private="false"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$address2" class="field all-12" data-dc-name="AccountInput.Address2" data-dctrack="true" data-private="false"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$city" class="field all-12" data-dc-name="AccountInput.City" data-dctrack="true" data-private="false"></dc-text-field>
            <dc-combobox class="field all-12" data-on-change="vm.fieldChanged(viewmodel.fields?.account?.accountInput$state)" data-field="viewmodel.fields?.account?.accountInput$state" data-dc-name="AccountInput.State" data-dctrack="true"></dc-combobox>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$zipCode" class="field all-12" data-dc-name="AccountInput.ZipCode" data-dctrack="true" data-private="false"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$primaryPhone" class="field all-12" data-dc-name="AccountInput.PrimaryPhone" data-dctrack="true"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$email" class="field all-12" data-dc-name="AccountInput.Email" data-dctrack="true"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$writingCompany" class="field all-12" data-dc-name="AccountInput.WritingCompany" data-dctrack="true"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$branchOffice" class="field all-12" data-dc-name="AccountInput.BranchOffice"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$businessPhone" class="field all-12" data-dc-name="AccountInput.BusinessPhone"></dc-text-field>
            <dc-text-field data-field="viewmodel.fields?.account?.accountInput$cellPhone" class="field all-12" data-dc-name="AccountInput.CellPhone" data-dctrack="true"></dc-text-field>
            <div class="field all-12">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.account?.addPartyAction" data-dc-name="addPartyAction" mode="button" data-dctrack="true"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <div class="field all-12">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.account?.updatePartyAction" data-dc-name="updatePartyAction" mode="button"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <div class="field all-12">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.account?.riskDashboardAction" data-dc-name="riskDashboardAction" mode="button"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <div class="field all-12">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.account?.autoPartySearchAction" data-dc-name="autoPartySearchAction" mode="button"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <div class="field all-12">
              <div class="control-container default-all-shrink">
                <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.account?.manualPartySearchAction" data-dc-name="manualPartySearchAction" mode="button"></dc-action>
              </div>
              <!-- INSERTIONPOINT -->
            </div>
            <!-- INSERTIONPOINT -->
          </div>
          <dc-messages class="" data-messages="viewmodel.messages?.message" data-message-type="information"  data-if="viewmodel.messages?.message?.length != 0"></dc-messages>
        </div>
      </dc-section>
    </div>
  </div>
</div>

<?xml version="1.0" encoding="iso-8859-1"?>
<!-- @TYPE=VIEW @ID=DuckCreekTech_Party_AU_VM_3_0_0_0_PartySummary_EditPartyPhoneDetails_View -->
<div class="panel">
  <div class="field-container">
    <dc-combobox class="field all-3" data-on-change="vm.fieldChanged(viewmodel.fields?.partyPhone?.partyPhoneInput$phoneCountryCode)" data-field="viewmodel.fields?.partyPhone?.partyPhoneInput$phoneCountryCode" data-dc-name="PartyPhoneInput.PhoneCountryCode"></dc-combobox>
    <dc-combobox class="field all-2" data-on-change="vm.fieldChanged(viewmodel.fields?.partyPhone?.partyPhoneInput$phoneTypeCode)" data-field="viewmodel.fields?.partyPhone?.partyPhoneInput$phoneTypeCode" data-dc-name="PartyPhoneInput.PhoneTypeCode"></dc-combobox>
    <dc-text-field data-field="viewmodel.fields?.partyPhone?.partyPhoneInput$phoneNumber" class="field all-2" data-dc-name="PartyPhoneInput.PhoneNumber"></dc-text-field>
    <dc-text-field data-field="viewmodel.fields?.partyPhone?.partyPhoneInput$phoneExtension" class="field all-1" data-dc-name="PartyPhoneInput.PhoneExtension"></dc-text-field>
    <dc-checkbox data-field="viewmodel.fields?.partyPhone?.partyPhoneInput$primaryIndicator" data-dc-name="PartyPhoneInput.PrimaryIndicator" class="field all-shrink" data-labelafter="true"></dc-checkbox>
  </div>
  <div class="field-container default-all-12">
    <dc-timepicker data-field="viewmodel.fields?.partyPhone?.phoneExtendedData$bestTimeToCallFrom" data-dc-name="PhoneExtendedData.BestTimeToCallFrom" class="field all-2"></dc-timepicker>
    <dc-timepicker data-field="viewmodel.fields?.partyPhone?.phoneExtendedData$bestTimeToCallTo" data-dc-name="PhoneExtendedData.BestTimeToCallTo" class="field all-2"></dc-timepicker>
    <dc-datepicker data-field="viewmodel.fields?.partyPhone?.partyPhoneInput$phoneEffectiveDate" class="field all-2" data-dc-name="PartyPhoneInput.PhoneEffectiveDate"></dc-datepicker>
    <dc-datepicker data-field="viewmodel.fields?.partyPhone?.partyPhoneInput$phoneExpirationDate" class="field all-2" data-dc-name="PartyPhoneInput.PhoneExpirationDate"></dc-datepicker>
  </div>
  <div class="field-container default-all-12">
    <dc-text-field data-field="viewmodel.fields?.partyPhone?.partyPhoneInput$phoneComments" class="field" data-dc-name="PartyPhoneInput.PhoneComments"></dc-text-field>
  </div>
  <div class="field-container default-all-12 is-aligned-right has-padding-none">
    <div class="field all-12 has-padding-none">
      <div class="control-container default-all-shrink is-aligned-right">
        <dc-action class="control all-shrink has-padding-medium is-action" data-action="viewmodel.fields?.partyPhone?.save" data-dc-name="save" mode="button" data-closespopup="true"></dc-action>
        <dc-action class="control all-shrink has-padding-medium" data-action="viewmodel.fields?.partyPhone?.cancel" data-dc-name="cancel" mode="button" data-closespopup="true"></dc-action>
      </div>
      <!-- INSERTIONPOINT -->
    </div>
  </div>
</div>
